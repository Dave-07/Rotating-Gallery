<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotating Gallery</title>
	<link rel="stylesheet" href="style.css" type="text/css">
    <link rel="icon" href="icon.png" type="image/x-icon">
	
</head>
<body>

    <div class="image-container">
        <div class="image-container">
            <span style="--i: 1"><img src="images/img-1.jpg" alt="image" width="350"></span>
            <span style="--i: 2"><img src="images/img-2.jpg" alt="image" width="350"></span>
            <span style="--i: 3"><img src="images/img-3.jpg" alt="image" width="350"></span>
            <span style="--i: 4"><img src="images/img-4.jpg" alt="image" width="350"></span>
            <span style="--i: 5"><img src="images/img-5.jpg" alt="image" width="350"></span>
            <span style="--i: 6"><img src="images/img-6.jpg" alt="image" width="350"></span>
            <span style="--i: 7"><img src="images/img-7.jpg" alt="image" width="350"></span>
            <span style="--i: 8"><img src="images/img-8.jpg" alt="image" width="350"></span>
        </div>
    </div>

    <div class="btn-container">
        <button class="btn" id="prev">
            Prev
        </button>
        <button class="btn" id="next">
            Next
        </button>
    </div>
    
	<script src="script.js"></script>
</body>

</html>
